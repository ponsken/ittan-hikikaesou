<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一旦引き返そう｜テスト版</title>
<style>
 :root{color-scheme:dark;--ink:#faf6ef;--muted:#d1c7bf;--red:#ff625e;--yellow:#ffda55;--paper:#151316;--panel:#211f23;--line:#50434a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
.wrap{width:min(100% - 32px,720px);margin:auto}
header{border-top:5px solid var(--red);border-bottom:1px solid var(--line);background:#100f11}
header .wrap{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800}.version{font-size:.85rem;color:var(--muted)}
main{padding:22px 0 18px}h1,h2,p{margin:0}
h1{font-size:clamp(1.65rem,6vw,2.7rem);line-height:1.25;letter-spacing:-.025em}
h2{font-size:1.15rem;line-height:1.4}p+p{margin-top:10px}
.hero{position:relative;overflow:hidden;padding:clamp(18px,5vw,38px);padding-bottom:clamp(36px,8vw,58px);border:1px solid #fe7770;border-radius:13px;background:#9e1b27;margin-bottom:24px}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:9px;background:repeating-linear-gradient(130deg,#181519 0 12px,var(--yellow) 12px 24px)}
.hero h1{font-size:clamp(1.6rem,8vw,4.2rem);font-weight:900;line-height:1.12}
.hero h1 span{display:block;color:var(--yellow);font-size:.7em;margin-bottom:.3em}
.hero p{margin-top:17px;color:#fff5eb;font-weight:600}
.section-title{margin-bottom:10px}.stack{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;min-height:46px}button:disabled{cursor:default}
.card,.choice{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.card{border-left:4px solid var(--red)}
.card strong,.card small{display:block}.card small{font-size:.9rem;color:var(--muted)}
.card:hover,.choice:hover:enabled{border-color:var(--yellow);background:#302a29}
.panel{padding:clamp(16px,4vw,26px);border:1px solid var(--line);background:#19171a;border-radius:14px}
.context{margin:14px 0 20px;color:var(--muted)}
.back{border:0;background:none;padding:0 8px;margin:0 0 8px -8px;color:var(--yellow);font-weight:700}
.choice{display:grid;grid-template-columns:clamp(74px,23vw,144px) minmax(0,1fr);gap:12px;align-items:center}
.choice img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#332c31}
.choice:disabled{color:var(--muted)}
.choice[aria-pressed=true]{border:2px solid var(--yellow);padding:12px 14px;background:#453a22;color:var(--ink)}
.action{background:var(--yellow);border:0;border-radius:9px;color:#1b1610;padding:10px 16px;font-weight:800;width:100%;margin-top:12px}
.feedback{margin-top:16px;padding:16px;border-radius:10px;background:#3b3221;border-left:4px solid var(--yellow)}
.feedback.caution{background:#451e27;border-color:var(--red)}
.feedback h2,.next h2{margin-bottom:8px}
.next{margin-top:14px;padding:16px;background:var(--panel);border-radius:10px}.next ul{margin:0;padding-left:1.45em}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:list-item;align-content:center}
a{color:var(--yellow);text-underline-offset:.18em}
footer{padding:0 0 28px}
.help{background:#301b22;border:1px solid #90505a;border-radius:11px;padding:13px 15px}
.help strong{color:#ffb2aa}.source,.privacy{font-size:.85rem;color:var(--muted);margin-top:8px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}h1:focus,.feedback:focus{outline:none}
</style>
</head>

    story: '高額バイトに応募し、身分証を送った。仕事内容に不安を感じて断ろうとすると「家族の住所を知っている」と脅された。',
    choices: [
      ['集合場所には行かず、安全な場所から警察に相談する', '相手に会う前に相談できます。身分証を送っていても、経緯と脅しの内容を警察に伝えてください。', 'call'],
      ['一度だけ仕事を引き受ける', '指示に従うと、犯罪に加担させられるおそれがあります。集合場所に向かわず、安全な場所から相談しましょう。', 'parcel'],
      ['自分だけで相手と会って話をつける', '直接会うと危険が高まるおそれがあります。相手に会わず、安全な場所から警察に相談しましょう。', 'meeting']
    ],
    safe: 0,
    steps: ['集合場所へ行かず、安全な場所にとどまる。', '安全にできる範囲で、募集画面や脅しのメッセージを消さずに残す。', '警察に「応募後に身分証を送り、家族のことで脅されています」と伝える。'],
    guidance: 'https://www.npa.go.jp/bureau/sosikihanzai/tokusyusagi/ukeko_tyuui.html'
  },
  {
    title: '腹が立って、手が出そうになった',
    short: '言い争いが激しくなり、相手が目の前にいるとき',
    story: '言い争いが激しくなり、相手を押しそうになった。近くに出口があり、安全にその場を離れられる。',
    choices: [
      ['相手が謝るまで言い返す', '今はやり取りを続けるほど、衝動を抑えにくくなることがあります。出口を使って距離を取りましょう。', 'argument'],
      ['相手を押しのけて話を終わらせる', '押した相手が転倒して、けがをするおそれがあります。手を出す前に、その場を離れましょう。', 'hands'],
      ['会話を中断して、安全にその場を離れる', '相手と距離を取れました。落ち着くまで会話を再開せず、必要なら第三者に助けを求めましょう。', 'exit']
    ],
    safe: 2,
    steps: ['「今は話せない」と短く伝え、安全に離れる。', '距離を取ったら、信頼できる人に「言い争いになった。少し話を聞いてほしい」と連絡する。'],
    law: '相手にけががなくても暴行罪（刑法208条）が、けがを負わせた場合は傷害罪（同204条）が成立することがあります。'
  }
];

const app = document.querySelector('#app');

function focusStart() {
  app.querySelector('h1').focus({preventScroll:true});
  window.scrollTo(0, 0);
}

function showHome(focus = true) {
  app.innerHTML = `
    <section class="hero">
      <h1 tabindex="-1"><span>まだ間に合う。</span>一旦引き返そう。</h1>
      <p>行動に移す前に、ここで手を止めよう。</p>
    </section>
    <section aria-labelledby="scene-list">
      <h2 class="section-title" id="scene-list">試す場面を選ぶ</h2>
      <div class="stack">${scenes.map((scene, index) => `
        <button class="card" type="button" data-scene="${index}">
          <span><strong>${scene.title}</strong><small>${scene.short}</small></span>
        </button>`).join('')}</div>
    </section>`;
  app.querySelectorAll('[data-scene]').forEach(button => {
    button.addEventListener('click', () => showScene(scenes[Number(button.dataset.scene)]));
  });
  if (focus) focusStart();
}

function showScene(scene) {
  app.innerHTML = `
    <button class="back" type="button" id="back">場面一覧へ</button>
    <article class="panel">
      <h1 tabindex="-1">${scene.title}</h1>
      <p class="context">${scene.story}</p>
      <h2 class="section-title" id="question">次に、どうする？</h2>
      <div class="stack" role="group" aria-labelledby="question">
        ${scene.choices.map(([label, , image], index) => `
          <button class="choice" type="button" data-choice="${index}" aria-pressed="false">
            <img src="${choiceImages[image]}" alt="" decoding="async" width="144" height="108">
            <span>${label}</span>
          </button>`).join('')}
      </div>
      <div id="outcome"></div>
      ${scene.law ? `<details><summary>関連する刑法の条文</summary><p>${scene.law}</p><p><a href="https://laws.e-gov.go.jp/law/140AC0000000045">刑法の条文を読む（e-Gov）</a></p></details>` : ''}
      ${scene.guidance ? `<p class="source"><a href="${scene.guidance}">警察庁の闇バイトに関する注意喚起</a></p>` : ''}
    </article>`;
  app.querySelector('#back').addEventListener('click', () => showHome());
  const buttons = Array.from(app.querySelectorAll('[data-choice]'));
  buttons.forEach((button, index) => {
    button.addEventListener('click', () => {
      buttons.forEach(option => { option.disabled = true; });
      button.setAttribute('aria-pressed', 'true');
      showOutcome(scene, index);
    });
  });
  focusStart();
}

function showOutcome(scene, index) {
  const safe = index === scene.safe;
  const outcome = app.querySelector('#outcome');
  outcome.innerHTML = `
    <section class="feedback${safe ? '' : ' caution'}" tabindex="-1" aria-labelledby="response">
      <h2 id="response">${safe ? 'ここで引き返せます' : 'この場面で、一旦引き返そう'}</h2>
      <p>${scene.choices[index][1]}</p>
    </section>
    <section class="next">
      <h2>いま取れる行動</h2>
      <ul>${scene.steps.map(step => `<li>${step}</li>`).join('')}</ul>
    </section>
    <button class="action" id="other" type="button">別の場面を選ぶ</button>
    <button class="back" id="retry" type="button">同じ場面をもう一度</button>`;
  outcome.querySelector('#other').addEventListener('click', () => showHome());
  outcome.querySelector('#retry').addEventListener('click', () => showScene(scene));
  outcome.querySelector('.feedback').focus();
}

showHome(false);
</script>
</body>
</html>
